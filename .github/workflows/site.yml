name: site
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install activegraph numpy scipy
      - name: Re-check every claim (float and exact)
        run: |
          for c in claims/*/claim.json; do
            [ -e "$c" ] || continue
            if grep -q '"piece": "cube"' "$c"; then python3 verify3.py "$c" && python3 -m packing.certify3 "$c"; else python3 verify.py "$c" && python3 -m packing.certify "$c"; fi
          done
      - name: Build site
        run: python3 site/build.py
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
